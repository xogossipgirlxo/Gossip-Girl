<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gossip Girl</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div id="banner" class="banner"></div>

    <header>
      <h1 class="logo" id="logo">Gossip Girl</h1>
      <p class="tagline" id="tagline"></p>
      <nav>
        <a class="btn fill" href="tip.html">Send a Tip</a>
        <a class="btn" id="btn-telegram" href="#" target="_blank" rel="noopener">Recieve the blasts</a>
      </nav>
    </header>

    <input id="search" class="search" type="search" placeholder="Search the archives…" aria-label="Search the archives">

    <div class="filters">
      <button class="chip on" data-f="all">All</button>
      <button class="chip" data-f="spotted">Spotted</button>
      <button class="chip" data-f="blast">Blasts</button>
      <button class="chip" data-f="news">Rumors</button>
      <button class="chip" data-f="recap">Recaps</button>
    </div>

    <main id="posts"></main>

    <div class="rules">
      <strong>House Rules.</strong> No defamatory content, no photos without the person’s consent, nothing intimate or humiliating, and nothing involving minors. Anyone affected may request the removal of a post via the “Send a Tip” page.
    </div>
  </div>
  <script src="site.js"></script>
  <script src="app.js"></script>
</body>
</html>
